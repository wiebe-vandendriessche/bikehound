[project]
name = "bikehound"
version = "0.1.0"
description = "Sniffs out your stolen bike on second-hand marketplaces, every day."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [{ name = "Wiebe Vandendriessche" }]
keywords = ["stolen bike", "bicycle", "marketplace", "scraper", "ntfy", "self-hosted"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = ["httpx", "pillow", "playwright", "pyyaml", "torch", "transformers"]

[project.urls]
Homepage = "https://github.com/wiebe-vandendriessche/bikehound"
Issues = "https://github.com/wiebe-vandendriessche/bikehound/issues"

[project.scripts]
bikehound = "bikehound.cli:main"

# CPU wheels: no GPU needed for a few hundred photos a day, and ~2 GB less to download
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

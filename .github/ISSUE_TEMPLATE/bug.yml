name: Bug
description: BikeHound crashes or does something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste your ntfy topic, your config's location or photos of your bike.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Command and output
      description: The command you ran and its output (remove your ntfy topic).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD`, and your OS.
